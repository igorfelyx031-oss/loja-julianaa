<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juh Cosméticos — Beleza & Cuidados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fcf8f8;
            color: #333;
        }

        /* Banner de instalação PWA/Celular */
        .banner-instalar {
            background-color: #f0e4e4;
            padding: 10px;
            text-align: center;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0d0d0;
        }

        .fechar-banner {
            cursor: pointer;
            font-weight: bold;
            padding: 0 10px;
        }

        header {
            background-color: #7a1b41;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .container {
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Seção de Filtros e Categorias */
        .filtros-marcas, .filtros-categorias {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            margin-bottom: 0.5rem;
            white-space: nowrap;
        }

        /* Esconder barra de rolagem mas manter a função arrastar no celular */
        .filtros-marcas::-webkit-scrollbar, .filtros-categorias::-webkit-scrollbar {
            display: none;
        }

        .btn-filtro {
            background: white;
            border: 1px solid #7a1b41;
            color: #7a1b41;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .btn-filtro.ativo {
            background-color: #7a1b41;
            color: white;
        }

        .info-loja {
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            border: 1px solid #f0e4e4;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Grid de produtos vazio */
        .grid-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .sem-produtos {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="banner-instalar">
        <span>📱 Quer salvar a JUH Cosméticos no seu celular como aplicativo?</span>
        <span class="fechar-banner">×</span>
    </div>

    <header>
        <h1>JUH Cosméticos — Beleza & Cuidados</h1>
        <p>Beleza que combina com você ✨</p>
    </header>

    <div class="container">
        
        <!-- Filtros de Marcas -->
        <div class="filtros-marcas">
            <button class="btn-filtro ativo">Todos</button>
            <button class="btn-filtro">O Boticário</button>
            <button class="btn-filtro">Eudora</button>
        </div>

        <!-- Filtros de Categorias -->
        <div class="filtros-categorias">
            <button class="btn-filtro ativo">Todos</button>
            <button class="btn-filtro">Perfumes</button>
            <button class="btn-filtro">Body Splash</button>
            <button class="btn-filtro">Hidratantes</button>
            <button class="btn-filtro">Desodorantes</button>
            <button class="btn-filtro">Sabonetes</button>
            <button class="btn-filtro">Kits</button>
            <button class="btn-filtro">Cuidados Corporais</button>
        </div>

        <div class="info-loja">
            🛍️ Monte sua sacola e finalize seu pedido pelo WhatsApp.
        </div>

        <!-- O Grid começa vazio para você adicionar os novos itens -->
        <div class="grid-produtos">
            <div class="sem-produtos">
                Nenhum produto cadastrado no momento.
            </div>
        </div>

    </div>

</body>
</html>
